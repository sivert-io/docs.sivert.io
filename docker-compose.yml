services:
  docs:
    build:
      context: .
    container_name: project-docs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      # Bind on all interfaces so another machine can proxy to it.
      # NOTE: This exposes the service on your LAN/WAN depending on firewall.
      - "0.0.0.0:31234:3000"

