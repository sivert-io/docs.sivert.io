services:
  docs:
    build:
      context: .
      args:
        # Set by scripts/auto_update.sh at deploy time.
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-dev}
    container_name: project-docs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      # Bind on all interfaces so another machine can proxy to it.
      # NOTE: This exposes the service on your LAN/WAN depending on firewall.
      - "0.0.0.0:31234:3000"

